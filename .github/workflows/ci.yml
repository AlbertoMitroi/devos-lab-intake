name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Docker
        run: docker build --target test .
      - name: Build the runtime image
        run: docker build --target runtime -t lab-intake:ci .
